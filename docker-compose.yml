services:
  postgres:
    image: postgres:16
    container_name: elections-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elections
    ports:
      - "5432:5432"
    volumes:
      - elections-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elections"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  elections-pgdata:
