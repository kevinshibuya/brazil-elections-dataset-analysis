[project]
name = "observatory"
version = "0.1.0"
description = "Brazil 2022 election anomaly observatory pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.0",
    "scipy>=1.13",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observatory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = '-m "not integration"'
markers = [
    "integration: end-to-end tests that need external resources (deselected by default)",
    "db: tests that require a live Postgres database",
]
